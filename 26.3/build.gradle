plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = findProperty('releaseBuild') == 'true' ? mod_version : "${mod_version}-unreleased.${unreleased_revision}"
group = 'de.topas'
base { archivesName = "farbound-${version}-mc26.3" }
repositories { mavenCentral() }
loom { splitEnvironmentSourceSets() }
// Keep the development profile stable across runClient sessions. Normal launchers are unaffected.
loom.runs.named('client') { programArgs '--username', 'FarboundDev' }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(Jar).configureEach { archiveVersion = '' }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
